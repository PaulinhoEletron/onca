[project]
name = "onca"
version = "0.1.0"
description = "Onça Guardiã: relatório semanal de riscos ambientais e climáticos por região do Brasil"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pypdf>=5.0",
    "trafilatura>=1.12",
    "pyyaml>=6.0",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "torch>=2.4",
]

[project.scripts]
onca = "onca.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "transformers.*", "trafilatura.*", "pgvector.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que precisam de um Postgres em execução",
    "model: testes que carregam o modelo real de embeddings (precisa estar em cache)",
]
addopts = "-m 'not model'"
